name: Compilar Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkgconf bsdmainutils curl git ca-certificates python3 cmake g++-mingw-w64-x86-64-posix wine64
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
      - name: Recuperar bibliotecas de apoio (cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/x86_64-w64-mingw32
          key: windows-depends-${{ hashFiles('depends/packages/**', 'depends/*.mk') }}
      - name: Bibliotecas de apoio (demora)
        run: make -C depends HOST=x86_64-w64-mingw32 NO_QT=1 NO_ZMQ=1 NO_IPC=1 -j $(nproc)
      - name: Guardar bibliotecas de apoio (cache)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/x86_64-w64-mingw32
          key: windows-depends-${{ hashFiles('depends/packages/**', 'depends/*.mk') }}
      - name: Configurar
        run: cmake -B build --toolchain depends/x86_64-w64-mingw32/toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=OFF
      - name: Compilar
        run: cmake --build build -j $(nproc) --target bitcoin bitcoind bitcoin-cli bitcoin-tx bitcoin-util bitcoin-wallet
      - name: Compilar o motor de mineracao
        run: x86_64-w64-mingw32-g++-posix -O2 -std=c++17 -static -o build/bin/rubiana-miner.exe tools/rubiana-miner.cpp -I src/randomx/src $(find build -name librandomx.a | head -1) -lpthread
      - name: Listar
        run: ls -l build/bin
      - name: Conferir que abre (Wine)
        continue-on-error: true
        run: wine64 build/bin/rubianad.exe -version | head -3
      - name: Guardar os programas
        uses: actions/upload-artifact@v4
        with:
          name: rubiana-windows
          path: |
            build/bin/*.exe
            tools/rubiana-mine.py
            tools/rubiana-solo-miner.py
      - name: Montar o pacote para Windows (clique duplo)
        run: |
          set -e
          mkdir -p pacote/rubiana/build/bin pacote/rubiana/tools pacote/rubiana/python
          cp build/bin/rubianad.exe build/bin/rubiana-cli.exe build/bin/rubiana-miner.exe pacote/rubiana/build/bin/
          cp tools/rubiana-mine.py tools/rubiana-solo-miner.py pacote/rubiana/tools/
          cp packaging/windows/* pacote/rubiana/
          sed -i 's/$/\r/' pacote/rubiana/minerar.bat pacote/rubiana/parar.bat pacote/rubiana/configuracao.txt pacote/rubiana/LEIA-ME.txt
          cp COPYING pacote/rubiana/COPYING.txt
          curl -fsSL -o python-embed.zip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          echo "$(cat packaging/python-embed.sha256)  python-embed.zip" | sha256sum -c -
          unzip -q python-embed.zip -d pacote/rubiana/python
          (cd pacote && zip -qr ../rubiana-windows-pacote.zip rubiana)
      - name: Guardar o pacote
        uses: actions/upload-artifact@v4
        with:
          name: rubiana-windows-pacote
          path: rubiana-windows-pacote.zip
